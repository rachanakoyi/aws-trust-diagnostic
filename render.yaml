services:
  - type: web
    name: aws-trust-diagnostic
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_SOURCE
        value: fallback
      - key: DEMO_MODE
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "10"
